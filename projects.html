<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proyectos - Spot-Light</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-900 text-white">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <aside class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col">
            <!-- Logo -->
            <div class="p-6 border-b border-slate-800">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-lg">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <div class="font-bold text-lg">Spot-Light</div>
                        <div class="text-xs text-slate-500">Academic AI</div>
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 p-4">
                <a href="dashboard.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                        </path>
                    </svg>
                    <span class="font-medium">Dashboard</span>
                </a>
                <a href="projects.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-500/10 text-blue-400 mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                        </path>
                    </svg>
                    <span class="font-medium">Proyectos</span>
                </a>
                <a href="evaluations.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                        </path>
                    </svg>
                    <span class="font-medium">Evaluaciones</span>
                </a>
                <a href="analytics.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                        </path>
                    </svg>
                    <span class="font-medium">Analytics</span>
                </a>
                <a href="teams.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                        </path>
                    </svg>
                    <span class="font-medium">Equipos</span>
                </a>
            </nav>

            <!-- User Profile -->
            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition cursor-pointer">
                    <div
                        class="w-10 h-10 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-full flex items-center justify-center font-bold text-sm">
                        A
                    </div>
                    <div class="flex-1">
                        <div class="font-medium text-sm" id="userName">Admin</div>
                        <div class="text-xs text-slate-400">Administrador</div>
                    </div>
                    <button onclick="AuthService.logout()" class="text-slate-400 hover:text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-auto">

            <!-- Header -->
            <header class="bg-slate-900 border-b border-slate-800 px-8 py-6 sticky top-0 z-10">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h1 class="text-3xl font-bold mb-1">Gestión de Proyectos</h1>
                        <p class="text-slate-400">Administra y supervisa todos los proyectos académicos</p>
                    </div>
                    <button onclick="openNewProjectModal()"
                        class="gradient-primary px-6 py-3 rounded-lg font-semibold hover:shadow-lg hover:shadow-blue-500/50 transition flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4">
                            </path>
                        </svg>
                        Nuevo Proyecto
                    </button>
                </div>
            </header>

            <!-- Content -->
            <div class="p-8">

                <!-- Stats Cards -->
                <div class="grid grid-cols-4 gap-6 mb-8">
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
                        <div class="flex items-center justify-between mb-3">
                            <div class="p-3 bg-blue-500/20 rounded-lg">
                                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                                    </path>
                                </svg>
                            </div>
                        </div>
                        <div class="text-sm text-slate-400 mb-1">Total Proyectos</div>
                        <div class="text-3xl font-bold">48</div>
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
                        <div class="flex items-center justify-between mb-3">
                            <div class="p-3 bg-green-500/20 rounded-lg">
                                <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="text-sm text-slate-400 mb-1">Completados</div>
                        <div class="text-3xl font-bold text-green-400">32</div>
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
                        <div class="flex items-center justify-between mb-3">
                            <div class="p-3 bg-yellow-500/20 rounded-lg">
                                <svg class="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="text-sm text-slate-400 mb-1">En Progreso</div>
                        <div class="text-3xl font-bold text-yellow-400">12</div>
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
                        <div class="flex items-center justify-between mb-3">
                            <div class="p-3 bg-purple-500/20 rounded-lg">
                                <svg class="w-6 h-6 text-purple-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z">
                                    </path>
                                </svg>
                            </div>
                        </div>
                        <div class="text-sm text-slate-400 mb-1">Promedio</div>
                        <div class="text-3xl font-bold text-purple-400">8.7</div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-8">
                    <div class="grid grid-cols-4 gap-4">
                        <div class="relative">
                            <svg class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"
                                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                            <input type="text" id="searchInput" placeholder="Buscar proyectos..."
                                class="w-full pl-10 pr-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                        </div>
                        <select id="categoryFilter"
                            class="px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                            <option value="">Todas las categorías</option>
                            <option value="Sustentabilidad">Sustentabilidad</option>
                            <option value="IoT">IoT</option>
                            <option value="Salud">Salud</option>
                            <option value="Educación">Educación</option>
                            <option value="IA">IA</option>
                        </select>
                        <select id="sortBy"
                            class="px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                            <option value="date">Más recientes</option>
                            <option value="score">Mayor puntuación</option>
                            <option value="votes">Más evaluaciones</option>
                        </select>
                        <button onclick="applyFilters()"
                            class="bg-blue-500 hover:bg-blue-600 px-6 py-3 rounded-lg font-semibold transition">
                            Aplicar Filtros
                        </button>
                    </div>
                </div>

                <!-- Projects Grid -->
                <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Projects will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <!-- New Project Modal -->
    <div id="newProjectModal"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div
            class="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold">Nuevo Proyecto</h2>
                <button onclick="closeNewProjectModal()" class="text-slate-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
            <form id="newProjectForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Título del Proyecto</label>
                    <input type="text" id="projectTitle" required
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Categoría</label>
                    <select id="projectCategory" required
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500">
                        <option value="">Selecciona una categoría</option>
                        <option value="Sustentabilidad">Sustentabilidad</option>
                        <option value="IoT">IoT</option>
                        <option value="Salud">Salud</option>
                        <option value="Educación">Educación</option>
                        <option value="IA">IA</option>
                        <option value="General">General</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Descripción</label>
                    <textarea id="projectDescription" rows="4" required
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">URL del Video (MP4)</label>
                    <input type="url" id="projectVideo" required placeholder="https://example.com/video.mp4"
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Miembros del Equipo (separados por
                        coma)</label>
                    <input type="text" id="projectMembers" placeholder="Juan Pérez, Ana García"
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="submit"
                        class="flex-1 gradient-primary py-3 rounded-lg font-semibold hover:shadow-lg transition">
                        Crear Proyecto
                    </button>
                    <button type="button" onclick="closeNewProjectModal()"
                        class="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded-lg font-semibold transition">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        AuthService.requireAuth();
        const user = AuthService.getCurrentUser();
        if (user) document.getElementById('userName').textContent = user.name;

        let allProjects = [];

        async function loadProjects() {
            try {
                Utils.showLoading('projectsGrid');
                allProjects = await ApiService.projects.getAll();
                displayProjects(allProjects);
            } catch (error) {
                Utils.showError('projectsGrid', 'No se pudieron cargar los proyectos');
            }
        }

        function displayProjects(projects) {
            const grid = document.getElementById('projectsGrid');
            if (projects.length === 0) {
                grid.innerHTML = '<p class="text-slate-400 text-center py-12 col-span-full">No hay proyectos disponibles</p>';
                return;
            }
            grid.innerHTML = projects.map(project => `
                <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden hover:border-blue-500 transition cursor-pointer">
                    <div class="h-48 bg-gradient-to-br from-blue-500/20 to-cyan-500/20 flex items-center justify-center">
                        <svg class="w-16 h-16 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div class="p-6">
                        <div class="flex items-start justify-between mb-3">
                            <h3 class="font-bold text-lg flex-1">${project.title}</h3>
                            <span class="px-3 py-1 bg-blue-500/20 text-blue-400 rounded-full text-xs font-medium">${project.category}</span>
                        </div>
                        <p class="text-slate-400 text-sm mb-4 line-clamp-2">${project.description}</p>
                        <div class="flex items-center justify-between text-sm">
                            <div class="flex items-center gap-2">
                                <span class="text-yellow-500">⭐ ${Utils.formatScore(project.stats.averageScore)}</span>
                                <span class="text-slate-500">•</span>
                                <span class="text-slate-400">${project.stats.totalVotes} votos</span>
                            </div>
                            <a href="project-detail.html?id=${project.id}" class="text-blue-400 hover:text-blue-300 font-medium">Ver →</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = allProjects.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(search) || p.description.toLowerCase().includes(search);
                const matchesCategory = !category || p.category === category;
                return matchesSearch && matchesCategory;
            });

            if (sortBy === 'score') filtered.sort((a, b) => b.stats.averageScore - a.stats.averageScore);
            else if (sortBy === 'votes') filtered.sort((a, b) => b.stats.totalVotes - a.stats.totalVotes);
            else filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            displayProjects(filtered);
        }

        function openNewProjectModal() {
            document.getElementById('newProjectModal').classList.remove('hidden');
            document.getElementById('newProjectModal').classList.add('flex');
        }

        function closeNewProjectModal() {
            document.getElementById('newProjectModal').classList.add('hidden');
            document.getElementById('newProjectModal').classList.remove('flex');
            document.getElementById('newProjectForm').reset();
        }

        document.getElementById('newProjectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const members = document.getElementById('projectMembers').value.split(',').map(m => m.trim()).filter(m => m);
            const projectData = {
                title: document.getElementById('projectTitle').value,
                category: document.getElementById('projectCategory').value,
                description: document.getElementById('projectDescription').value,
                videoUrl: document.getElementById('projectVideo').value,
                members: members,
                stats: { averageScore: 0, totalVotes: 0 },
                createdAt: new Date().toISOString()
            };
            try {
                await ApiService.projects.create(projectData);
                Utils.showToast('Proyecto creado exitosamente', 'success');
                closeNewProjectModal();
                loadProjects();
            } catch (error) {
                Utils.showToast('Error al crear el proyecto', 'error');
            }
        });

        document.getElementById('searchInput').addEventListener('input', Utils.debounce(applyFilters, 300));
        loadProjects();
    </script>
</body>

</html>
