<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Principal - Spot-Light</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-900 text-white">
    <!-- El layout se inyecta aquí automáticamente -->
    <div id="app"></div>

    <!-- Contenido específico de la página (template) -->
    <template id="page-content">
        <!-- Content -->
        <div class="p-8">

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">

                <!-- Total Projects -->
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="p-3 bg-blue-500/20 rounded-lg">
                            <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z">
                                </path>
                            </svg>
                        </div>
                        <span class="text-xs text-slate-500">+12.5%</span>
                    </div>
                    <div class="text-3xl font-bold mb-1" id="totalProjects">1,284</div>
                    <div class="text-sm text-slate-400">Proyectos totales</div>
                </div>

                <!-- Pending Evaluations -->
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="p-3 bg-cyan-500/20 rounded-lg">
                            <svg class="w-6 h-6 text-cyan-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                                </path>
                            </svg>
                        </div>
                        <span class="text-xs text-slate-500">-3.2%</span>
                    </div>
                    <div class="text-3xl font-bold mb-1" id="pendingEvals">42</div>
                    <div class="text-sm text-slate-400">Evaluaciones pendientes</div>
                </div>

                <!-- Success Rate -->
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="p-3 bg-orange-500/20 rounded-lg">
                            <svg class="w-6 h-6 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                                </path>
                            </svg>
                        </div>
                        <span class="text-xs text-green-500">+5.1%</span>
                    </div>
                    <div class="text-3xl font-bold mb-1" id="successRate">98.2%</div>
                    <div class="text-sm text-slate-400">Tasa de éxito</div>
                </div>

                <!-- Active Users -->
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="p-3 bg-purple-500/20 rounded-lg">
                            <svg class="w-6 h-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                                </path>
                            </svg>
                        </div>
                        <span class="text-xs text-green-500">+8.3%</span>
                    </div>
                    <div class="text-3xl font-bold mb-1" id="activeUsers">856</div>
                    <div class="text-sm text-slate-400">Usuarios activos</div>
                </div>
            </div>

            <!-- Recent Projects Table -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-700 flex items-center justify-between">
                    <h2 class="text-lg font-bold">Lista de proyectos recientes</h2>
                    <button
                        class="gradient-primary px-4 py-2 rounded-lg text-sm font-semibold hover:shadow-lg hover:shadow-blue-500/50 transition">
                        Nuevo Proyecto
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-slate-900/50">
                            <tr>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider">
                                    Nombre del Proyecto</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider">
                                    Fecha de Creación</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider">
                                    Progreso</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider">
                                    Estado</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider">
                                    Acción</th>
                            </tr>
                        </thead>
                        <tbody id="projectsTableBody" class="divide-y divide-slate-700">
                            <!-- Projects will be loaded here -->
                        </tbody>
                    </table>
                </div>
                <div class="px-6 py-4 border-t border-slate-700 text-center">
                    <a href="projects.html" class="text-blue-400 hover:text-blue-300 text-sm font-medium">
                        Ver todos los proyectos →
                    </a>
                </div>
            </div>
        </div>
    </template>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/charts.js"></script>

    <!-- Layout Components -->
    <script src="js/header.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/layout.js"></script>

    <script>
        // Protect route
        AuthService.requireAuth();

        // Load dashboard data
        async function loadDashboard() {
            try {
                // Load stats
                const stats = await API.getStats();
                document.getElementById('totalProjects').textContent = stats.totalProjects.toLocaleString();
                document.getElementById('pendingEvals').textContent = stats.pendingEvaluations;
                document.getElementById('successRate').textContent = stats.successRate + '%';
                document.getElementById('activeUsers').textContent = stats.activeUsers.toLocaleString();

                // Load recent projects
                const projects = await API.getProjects({ limit: 4, sort: 'recent' });
                renderProjectsTable(projects);

            } catch (error) {
                console.error('Error loading dashboard:', error);
                Utils.showToast('Error al cargar el dashboard', 'error');
            }
        }

        // Render projects table
        function renderProjectsTable(projects) {
            const tbody = document.getElementById('projectsTableBody');

            if (!projects || projects.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-slate-400">
                            No hay proyectos recientes
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = projects.map(project => `
                <tr class="hover:bg-slate-700/50 transition">
                    <td class="px-6 py-4">
                        <div class="font-medium">${project.title}</div>
                        <div class="text-sm text-slate-400">${project.category}</div>
                    </td>
                    <td class="px-6 py-4 text-sm text-slate-400">
                        ${Utils.formatDate(project.createdAt)}
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <div class="flex-1 bg-slate-700 rounded-full h-2 overflow-hidden">
                                <div class="bg-gradient-to-r from-blue-500 to-cyan-500 h-full" style="width: ${project.progress || 75}%"></div>
                            </div>
                            <span class="text-sm text-slate-400">${project.progress || 75}%</span>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 rounded-full text-xs font-medium ${project.status === 'Completado' ? 'bg-green-500/20 text-green-400' :
                    project.status === 'En Progreso' ? 'bg-blue-500/20 text-blue-400' :
                        'bg-yellow-500/20 text-yellow-400'
                }">
                            ${project.status}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <button class="p-2 hover:bg-slate-600 rounded-lg transition" title="Ver">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                            <button class="p-2 hover:bg-slate-600 rounded-lg transition" title="Editar">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Initialize dashboard
        loadDashboard();
    </script>
</body>

</html>
