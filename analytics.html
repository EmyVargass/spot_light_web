                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    <a href="analytics.html"

                <div class="flex items-center gap-3">

                        class="w-10 h-10 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-full flex items-center justify-center font-bold">
                        A</div>
                    <div class="flex-1">
                        <p class="text-sm font-medium" id="userName">Admin</p>
                        <p class="text-xs text-slate-400">Administrador</p>
                    </div>
                    <button onclick="AuthService.logout()" class="text-slate-400 hover:text-white"><svg class="w-5 h-5"
                            fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                            </path>
                        </svg></button>

        <main class="flex-1 ml-64 p-8">
            <div class="mb-8">
                <h1 class="text-3xl font-bold mb-2">Analytics Avanzados</h1>
                <p class="text-slate-400">Análisis detallado de datos y tendencias</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
                    <h3 class="text-lg font-semibold mb-4">Comparativa de Criterios</h3>
                    <div class="h-64"><canvas id="radarChart"></canvas></div>
                </div>
                <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
                    <h3 class="text-lg font-semibold mb-4">Tendencia Mensual</h3>
                    <div class="h-64"><canvas id="lineChart"></canvas></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
                    <h3 class="text-lg font-semibold mb-4">Proyectos por Categoría</h3>
                    <div class="h-64"><canvas id="pieChart"></canvas></div>
                </div>
                <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
                    <h3 class="text-lg font-semibold mb-4">Distribución de Puntuaciones</h3>
                    <div class="h-64"><canvas id="barChart"></canvas></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/charts.js"></script>
    <script>
        AuthService.requireAuth();
        const user = AuthService.getCurrentUser();
        if (user) document.getElementById('userName').textContent = user.name;

        async function loadAnalytics() {
            try {
                const projects = await ApiService.projects.getAll();
                const evaluations = await ApiService.evaluations.getAll();

                // Radar Chart - Average scores by criteria
                const avgScores = {
                    innovation: Utils.average(evaluations.map(e => e.scores.innovation)),
                    functionality: Utils.average(evaluations.map(e => e.scores.functionality)),
                    ui: Utils.average(evaluations.map(e => e.scores.ui)),
                    impact: Utils.average(evaluations.map(e => e.scores.impact))
                };
                ChartUtils.createRadarChart('radarChart',
                    ['Innovación', 'Funcionalidad', 'UI/UX', 'Impacto'],
                    [{ label: 'Promedio', data: Object.values(avgScores) }]
                );

                // Line Chart - Monthly trend
                ChartUtils.createLineChart('lineChart',
                    ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun'],
                    [{ label: 'Proyectos', data: [2, 4, 3, 5, 7, 12] }]
                );

                // Pie Chart - Projects by category
                const categories = {};
                projects.forEach(p => categories[p.category] = (categories[p.category] || 0) + 1);
                ChartUtils.createPieChart('pieChart', Object.keys(categories), Object.values(categories));

                // Bar Chart - Score distribution
                const scoreRanges = { '0-1': 0, '1-2': 0, '2-3': 0, '3-4': 0, '4-5': 0 };
                projects.forEach(p => {
                    const score = p.stats.averageScore;
                    if (score < 1) scoreRanges['0-1']++;
                    else if (score < 2) scoreRanges['1-2']++;
                    else if (score < 3) scoreRanges['2-3']++;
                    else if (score < 4) scoreRanges['3-4']++;
                    else scoreRanges['4-5']++;
                });
                ChartUtils.createBarChart('barChart', Object.keys(scoreRanges), Object.values(scoreRanges), 'Proyectos');

            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }

        loadAnalytics();
    </script>
</body>

</html>
