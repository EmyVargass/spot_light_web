<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Proyectos - Spot-Light</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .project-card {
            transition: all 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(19, 127, 236, 0.3);
        }

        .project-image {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            position: relative;
            overflow: hidden;
        }

        .project-image::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(19, 127, 236, 0.1) 0%, transparent 70%);
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body class="bg-slate-900 text-white">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <aside class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col">
            <!-- Logo -->
            <div class="p-6 border-b border-slate-800">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-lg">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <div class="font-bold text-lg">Spot-Light</div>
                        <div class="text-xs text-slate-500">Academic AI</div>
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 p-4">
                <a href="dashboard.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                        </path>
                    </svg>
                    <span class="font-medium">Catálogo</span>
                </a>
                <a href="projects.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-500/10 text-blue-400 mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                        </path>
                    </svg>
                    <span class="font-medium">Proyectos</span>
                </a>
                <a href="evaluations.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                        </path>
                    </svg>
                    <span class="font-medium">Evaluaciones</span>
                </a>
                <a href="teams.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                        </path>
                    </svg>
                    <span class="font-medium">Equipo</span>
                </a>
                <a href="role-selection.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="font-medium">Configuración</span>
                </a>
            </nav>

            <!-- User Profile -->
            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition cursor-pointer">
                    <div
                        class="w-10 h-10 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-full flex items-center justify-center font-bold text-sm">
                        AT
                    </div>
                    <div class="flex-1">
                        <div class="font-medium text-sm">Alex Thorne</div>
                        <div class="text-xs text-slate-500">Evaluador</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-auto">

            <!-- Header -->
            <header class="bg-slate-900 border-b border-slate-800 px-8 py-6 sticky top-0 z-10">
                <div class="mb-6">
                    <h1 class="text-3xl font-bold mb-2">Catálogo de Proyectos</h1>
                    <p class="text-slate-400">Repositorio de trabajos estudiantiles con integración en IA académica.</p>
                </div>

                <!-- Search and Filters -->
                <div class="flex items-center gap-4">
                    <!-- Search -->
                    <div class="flex-1 relative">
                        <svg class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"
                            fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <input type="text" id="searchInput"
                            placeholder="Buscar proyectos, categorías de datos e investigadores..."
                            class="w-full pl-10 pr-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                    </div>

                    <!-- Filter Buttons -->
                    <button
                        class="gradient-primary px-6 py-3 rounded-lg font-semibold hover:shadow-lg hover:shadow-blue-500/50 transition">
                        Todos
                    </button>
                    <button
                        class="bg-slate-800 border border-slate-700 px-6 py-3 rounded-lg font-semibold hover:bg-slate-700 transition">
                        IA
                    </button>
                    <button
                        class="bg-slate-800 border border-slate-700 px-6 py-3 rounded-lg font-semibold hover:bg-slate-700 transition">
                        Web
                    </button>
                    <button
                        class="bg-slate-800 border border-slate-700 px-6 py-3 rounded-lg font-semibold hover:bg-slate-700 transition">
                        Móvil
                    </button>

                    <!-- View Toggle -->
                    <div class="flex items-center gap-2 bg-slate-800 border border-slate-700 rounded-lg p-1">
                        <button class="p-2 bg-blue-500 rounded text-white">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                                </path>
                            </svg>
                        </button>
                        <button class="p-2 text-slate-400 hover:text-white">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Sort -->
                    <button
                        class="flex items-center gap-2 bg-slate-800 border border-slate-700 px-4 py-3 rounded-lg hover:bg-slate-700 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
                        </svg>
                        Filtros Avanzados
                    </button>
                </div>

                <!-- Results count -->
                <div class="mt-4 text-sm text-slate-400">
                    <span id="resultsCount">12 proyectos encontrados</span>
                </div>
            </header>

            <!-- Projects Grid -->
            <div class="p-8">
                <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Projects will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>

    <script>
        // Sample projects data
        const projects = [
            {
                id: 1,
                title: 'Optimización de Rutas Neuronales',
                description: 'Un estudio avanzado sobre algoritmos de aprendizaje profundo...',
                category: 'IA - Machine Learning',
                image: 'neural',
                color: 'from-blue-500 to-cyan-500'
            },
            {
                id: 2,
                title: 'App Móvil de Tienda Next-Gen',
                description: 'Aplicación de IA para la visualización de productos en tiempo real...',
                category: 'WEB - Aplicación Móvil',
                image: 'mobile',
                color: 'from-slate-400 to-slate-600'
            },
            {
                id: 3,
                title: 'Voto Seguro vía Blockchain',
                description: 'Simulación DEMO de un sistema de votación descentralizada y segura...',
                category: 'WEB - Blockchain',
                image: 'blockchain',
                color: 'from-orange-500 to-yellow-500'
            },
            {
                id: 4,
                title: 'Visualizador Climático Global',
                description: 'Herramienta de análisis de datos climáticos en tiempo real...',
                category: 'WEB - Ciencia de Datos',
                image: 'climate',
                color: 'from-green-500 to-emerald-500'
            },
            {
                id: 5,
                title: 'Toolkit de Redes Neuronales',
                description: 'Un conjunto visualizado de herramientas para entrenar modelos de IA...',
                category: 'WEB - Machine Learning',
                image: 'toolkit',
                color: 'from-cyan-500 to-blue-500'
            },
            {
                id: 6,
                title: 'Laboratorio de Sistemas Distribuidos',
                description: 'Plataforma educativa para aprender conceptos de sistemas distribuidos...',
                category: 'WEB - Infraestructura',
                image: 'distributed',
                color: 'from-slate-600 to-slate-800'
            }
        ];

        // Render projects
        function renderProjects(projectsToRender = projects) {
            const grid = document.getElementById('projectsGrid');
            document.getElementById('resultsCount').textContent = `${projectsToRender.length} proyectos encontrados`;

            grid.innerHTML = projectsToRender.map(project => `
                <div class="project-card bg-slate-800 border border-slate-700 rounded-xl overflow-hidden cursor-pointer">
                    <!-- Project Image -->
                    <div class="project-image h-48 flex items-center justify-center relative">
                        <div class="absolute inset-0 bg-gradient-to-br ${project.color} opacity-10"></div>
                        ${getProjectIcon(project.image)}
                        <span class="absolute top-4 right-4 px-3 py-1 bg-slate-900/80 backdrop-blur-sm rounded-full text-xs font-medium border border-slate-700">
                            Nuevo
                        </span>
                    </div>
                    
                    <!-- Project Info -->
                    <div class="p-6">
                        <div class="flex items-start justify-between mb-3">
                            <div class="flex-1">
                                <h3 class="font-bold text-lg mb-2">${project.title}</h3>
                                <p class="text-sm text-slate-400 mb-3">${project.description}</p>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-slate-500">${project.category}</span>
                            <button class="text-blue-400 hover:text-blue-300 font-medium text-sm flex items-center gap-1">
                                Ver proyecto
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Get project icon based on type
        function getProjectIcon(type) {
            const icons = {
                neural: `
                    <svg class="w-24 h-24 text-blue-500 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
                    </svg>
                `,
                mobile: `
                    <svg class="w-24 h-24 text-slate-400 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                `,
                blockchain: `
                    <svg class="w-24 h-24 text-orange-500 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                `,
                climate: `
                    <svg class="w-24 h-24 text-green-500 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                `,
                toolkit: `
                    <svg class="w-24 h-24 text-cyan-500 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                `,
                distributed: `
                    <svg class="w-24 h-24 text-slate-500 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path>
                    </svg>
                `
            };
            return icons[type] || icons.neural;
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = projects.filter(project =>
                project.title.toLowerCase().includes(searchTerm) ||
                project.description.toLowerCase().includes(searchTerm) ||
                project.category.toLowerCase().includes(searchTerm)
            );
            renderProjects(filtered);
        });

        // Initialize
        renderProjects();
    </script>
</body>

</html>
